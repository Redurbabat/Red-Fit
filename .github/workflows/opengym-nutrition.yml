# Checks the actual ORIGINAL openGym frontend, not the older independent RED Fit root app.
# This job is independent of the unrelated root ESLint error in workout/setNotes.ts.
name: Original openGym Nutrition

on:
  pull_request:
    paths:
      - '.github/workflows/opengym-nutrition.yml'
      - 'vendor/opengym-upstream/frontend/src/nutrition/**'
      - 'vendor/opengym-upstream/frontend/src/views/Nutrition.jsx'
      - 'vendor/opengym-upstream/frontend/src/App.jsx'
      - 'vendor/opengym-upstream/frontend/src/views/Home.jsx'
      - 'vendor/opengym-upstream/frontend/package.json'
      - 'vendor/opengym-upstream/frontend/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nutrition:
    name: Nutrition tests and iPhone-flavour web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vendor/opengym-upstream/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/opengym-upstream/frontend/package-lock.json

      - name: Install original openGym dependencies
        run: npm ci --no-audit --no-fund

      - name: Run nutrition Vitest suite
        run: npx vitest run src/nutrition

      # Regression gate for original openGym features (workouts, sessions, sync, etc.).
      # Run independently of the unrelated RED Fit root ESLint job.
      - name: Run full original openGym Vitest suite
        run: npm test

      - name: Build original openGym mobile-flavour frontend
        run: VITE_MOBILE=1 npm run build

      # The original app targets Safari 15.5. Verify that every generated JS
      # chunk can be parsed on this floor before copying it into the iOS shell.
      - name: Check minimum iOS WebView JS compatibility
        run: node scripts/check-bundle-syntax.mjs dist

      # cap copy only stages web assets in the existing native project on the
      # ephemeral runner; it does NOT sign, build or change iOS project code.
      - name: Copy mobile frontend into original iOS Capacitor shell
        run: npx cap copy ios

      - name: Verify copied iOS mobile shell
        run: |
          node scripts/check-mobile-bundle.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import assert from 'node:assert/strict';
            const dir = 'ios/App/App/public/assets';
            assert.ok(fs.existsSync(dir), 'iOS web assets were not copied');
            assert.ok(fs.readdirSync(dir).some(file => /^Nutrition-.+\\.js$/.test(file)), 'Nutrition screen missing from iOS copy');
            console.log('Nutrition chunk present in iOS Capacitor web assets');
          "

      - name: Verify mobile flavour and nutrition bundle
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import assert from 'node:assert/strict';
            const html = fs.readFileSync('dist/index.html', 'utf8');
            assert.match(html, /name=[\"']opengym-flavor[\"']/);
            assert.match(html, /content=[\"']mobile[\"']/);
            assert.ok(fs.readdirSync('dist/assets').some(name => name.endsWith('.js')));
            console.log('Original openGym mobile-flavour bundle verified');
          "
