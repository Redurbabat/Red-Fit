# Temporary Agent01/Agent04 integration: no merges, no Apple secrets, UNSIGNED IPA.
name: Agent01 + Agent04 combined unsigned iPhone IPA (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/agent01-04-combined-unsigned-ipa-temporary.yml'
permissions:
  contents: read

jobs:
  combined-unsigned-device-ipa:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/opengym-upstream/frontend
    steps:
      - name: Checkout exact Agent01 pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Overlay only pinned Agent04 original app sources
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 4609b48dfd4c9d5ad070a699b8a86804242f8bb0
          test "$(git rev-parse FETCH_HEAD)" = "4609b48dfd4c9d5ad070a699b8a86804242f8bb0"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git restore --source=FETCH_HEAD -- \
            vendor/opengym-upstream/frontend/capacitor.config.json \
            vendor/opengym-upstream/frontend/ios/App/AnimationPacksDownloader/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/App/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/App/MainViewController.swift \
            vendor/opengym-upstream/frontend/ios/App/OpenGymWidgets/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/Watch/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/Watch/de.lproj/InfoPlist.strings \
            vendor/opengym-upstream/frontend/ios/App/WatchWidgets/Info.plist \
            vendor/opengym-upstream/frontend/ios/ci/brand-red-fit.swift \
            vendor/opengym-upstream/frontend/package.json \
            vendor/opengym-upstream/frontend/scripts/check-ios-mobile-bundle.mjs \
            vendor/opengym-upstream/frontend/scripts/check-ios-mobile-bundle.test.mjs \
            vendor/opengym-upstream/frontend/scripts/verify-ios-identity.mjs \
            vendor/opengym-upstream/frontend/scripts/verify-ios-identity.test.mjs \
            vendor/opengym-upstream/frontend/scripts/verify-unsigned-ipa.py \
            vendor/opengym-upstream/frontend/src/components/TabBar.jsx \
            vendor/opengym-upstream/frontend/src/components/TabBar.native-dock.test.jsx \
            vendor/opengym-upstream/frontend/src/index.css \
            vendor/opengym-upstream/frontend/src/views/Home.jsx
          echo "AGENT04_PIN=4609b48dfd4c9d5ad070a699b8a86804242f8bb0"
          git status --short
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/opengym-upstream/frontend/package-lock.json
      - name: Verify latest native IPA validator fixture
        run: python3 scripts/verify-unsigned-ipa.py --selftest
      - name: Verify iOS identity and bundle helper fixtures
        run: |
          npm run test:ios-bundle
          npm run test:ios-identity-unit
      - name: Install original locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build combined RED Fit iPhone web payload and sync Xcode
        run: npm run build:ios
      - name: Add original Watch, iPhone Widgets and background assets
        run: |
          ruby ios/ci/add-asset-downloader.rb
          ruby ios/ci/add-watch-app.rb
          ruby ios/ci/add-widgets.rb
      - name: Build unsigned iPhone arm64 App and package combined IPA
        run: |
          set -o pipefail
          mkdir -p ios/App/build
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build/dd-device CODE_SIGNING_ALLOWED=NO \
            build | tee ios/App/build/agent01-04-combined-device.log
          app=ios/App/build/dd-device/Build/Products/Debug-iphoneos/App.app
          test -d "$app"
          mkdir -p ios/App/build/unsigned/Payload
          ditto "$app" ios/App/build/unsigned/Payload/App.app
          (cd ios/App/build/unsigned && zip -qry RED-Fit-Agent01-04-UNSIGNED.ipa Payload)
          test -s ios/App/build/unsigned/RED-Fit-Agent01-04-UNSIGNED.ipa
      - name: Verify actual combined IPA native identities and embedded web assets
        run: python3 scripts/verify-unsigned-ipa.py ios/App/build/unsigned/RED-Fit-Agent01-04-UNSIGNED.ipa
      - name: Record pinned source SHAs and verify artifact digest
        run: |
          {
            echo "Agent01 PR event SHA: ${{ github.event.pull_request.head.sha }}"
            echo "Agent04 overlay SHA: 4609b48dfd4c9d5ad070a699b8a86804242f8bb0"
            echo "Code signing: DISABLED"
            echo "Physical device install: NOT TESTED"
          } > ios/App/build/unsigned/integration-manifest.txt
          shasum -a 256 ios/App/build/unsigned/RED-Fit-Agent01-04-UNSIGNED.ipa | tee ios/App/build/unsigned/sha256.txt
      - name: Retain private combined unsigned IPA and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent01-04-combined-unsigned-iphone
          retention-days: 7
          if-no-files-found: warn
          path: |
            vendor/opengym-upstream/frontend/ios/App/build/unsigned/RED-Fit-Agent01-04-UNSIGNED.ipa
            vendor/opengym-upstream/frontend/ios/App/build/unsigned/sha256.txt
            vendor/opengym-upstream/frontend/ios/App/build/unsigned/integration-manifest.txt
            vendor/opengym-upstream/frontend/ios/App/build/agent01-04-combined-device.log
