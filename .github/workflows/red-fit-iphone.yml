# Private QA of the ORIGINAL openGym iOS/Xcode app, rebranded as RED Fit.
# The upstream workflow nested under vendor/ is NOT a runnable root GitHub Actions workflow.
# An unsigned IPA is a build artifact only; it is not ready to install without valid signing.
name: RED Fit – original iPhone

on:
  pull_request:
    paths:
      - 'vendor/opengym-upstream/frontend/**'
      - '.github/workflows/red-fit-iphone.yml'
      - 'tools/opengym-qa/private-ipa-artifact*'
  workflow_dispatch:
    inputs:
      ipa_recipient:
        description: 'Optional base64 SPKI public key for an encrypted owner-only IPA export (RSA 3072+). Never enter a private key.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: red-fit-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/opengym-upstream/frontend
    steps:
      - name: Checkout complete original openGym tree
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/opengym-upstream/frontend/package-lock.json

      - name: Test original iOS mobile asset guard (Node only)
        run: npm run test:ios-bundle

      - name: Test RED Fit native identity and entitlement guard (Node only)
        run: npm run test:ios-identity-unit

      - name: Verify iPhone uses Apple's system UITabBar and keeps original workout routing
        run: node --test scripts/verify-native-tabbar.test.mjs

      - name: Self-test IPA integrity and embedded target validator
        run: python3 scripts/verify-unsigned-ipa.py --selftest

      - name: Test encrypted owner-only IPA export
        working-directory: .
        run: node --test tools/opengym-qa/private-ipa-artifact.test.mjs

      - name: Install original locked dependencies
        run: npm ci

      - name: Test RED Fit native glass dock routing and keyboard/modal safety
        run: npx vitest run src/components/TabBar.native-dock.test.jsx src/lib/local-only.test.js src/store/useStore.local-only.test.jsx src/store/useStore.local-only.mobile.test.jsx

      - name: Build and brand existing Capacitor app
        run: APP_BUILD="${GITHUB_SHA:0:8}" npm run build:ios

      - name: Attach original Apple integrations
        run: |
          ruby ios/ci/add-asset-downloader.rb
          ruby ios/ci/add-watch-app.rb
          ruby ios/ci/add-widgets.rb

      - name: Build unsigned iPhone Simulator app
        run: |
          set -o pipefail
          mkdir -p ios/App/build
          xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build/dd-sim CODE_SIGNING_ALLOWED=NO \
            build | tee ios/App/build/simulator.log
          test -d ios/App/build/dd-sim/Build/Products/Debug-iphonesimulator/App.app

      - name: Build device binary and package unsigned IPA
        run: |
          set -o pipefail
          xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build/dd-device CODE_SIGNING_ALLOWED=NO \
            build | tee ios/App/build/device.log
          app=ios/App/build/dd-device/Build/Products/Debug-iphoneos/App.app
          test -d "$app"
          mkdir -p ios/App/build/unsigned/Payload
          ditto "$app" ios/App/build/unsigned/Payload/App.app
          (cd ios/App/build/unsigned && zip -qry RED-Fit-UNSIGNED.ipa Payload)
          test -s ios/App/build/unsigned/RED-Fit-UNSIGNED.ipa

      - name: Verify actual unsigned IPA payload and Apple bundle identities
        run: python3 scripts/verify-unsigned-ipa.py ios/App/build/unsigned/RED-Fit-UNSIGNED.ipa

      - name: Encrypt unsigned IPA for the owner's local recipient
        id: encrypt_ipa
        if: github.event_name == 'workflow_dispatch' && inputs.ipa_recipient != ''
        env:
          REDFIT_IPA_RECIPIENT: ${{ inputs.ipa_recipient }}
        run: node ../../../tools/opengym-qa/private-ipa-artifact.mjs encrypt ios/App/build/unsigned/RED-Fit-UNSIGNED.ipa ios/App/build/protected-ipa

      - name: Keep encrypted owner-only IPA
        if: always() && steps.encrypt_ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: red-fit-encrypted-ipa-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: vendor/opengym-upstream/frontend/ios/App/build/protected-ipa/

      - name: Attach the original openGym XCUITest target without changing the committed Xcode project
        run: ruby ios/ci/add-ui-tests.rb

      - name: Smoke-test native Apple tab bar and original workout routing on a booted iPhone Simulator
        run: |
          set -o pipefail
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d["udid"] for runtime, group in sorted(devices.items(), reverse=True)
                   if ".iOS-" in runtime
                   for d in group
                   if d.get("isAvailable", True) and d["name"].startswith("iPhone")]
          print(found[0] if found else "")
          ')"
          if [ -z "$simulator" ]; then
            echo "::error::No bootable iPhone Simulator is installed on this macOS runner"
            exit 1
          fi
          xcodebuild -quiet -workspace ios/App/App.xcworkspace -scheme AppUITests -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath ios/App/build/dd-sim \
            -resultBundlePath ios/App/build/native-dock.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:AppUITests/OpenGymUITests/test0REDFitNativeTabBarKeepsOriginalNavigation \
            -only-testing:AppUITests/REDFitSwiftUIUITests \
            CODE_SIGNING_ALLOWED=NO test | tee ios/App/build/native-dock-smoke.log

      - name: Export only the synthetic native dock crop
        if: always()
        run: |
          if [ -d ios/App/build/native-dock.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/App/build/native-dock.xcresult --output-path ios/App/build/raw-attachments
            python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('ios/App/build/raw-attachments')
          out = pathlib.Path('ios/App/build/dock-evidence')
          out.mkdir(exist_ok=True)
          def visit(value):
              if isinstance(value, dict):
                  names = [v for v in value.values() if isinstance(v, str)]
                  label = next((v for v in names if v.startswith('redfit-glass-home')), None)
                  if label:
                      for name in names:
                          candidate = root / pathlib.Path(name).name
                          if candidate.suffix.lower() == '.png' and candidate.is_file():
                              shutil.copyfile(candidate, out / 'redfit-glass-home.png')
                  for child in value.values(): visit(child)
              elif isinstance(value, list):
                  for child in value: visit(child)
          for manifest in root.rglob('manifest.json'): visit(json.loads(manifest.read_text()))
          PY
          fi

      - name: Keep synthetic Apple dock screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-fit-native-dock-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: vendor/opengym-upstream/frontend/ios/App/build/dock-evidence/*.png

      - name: Keep private QA evidence
        # Exercise media are separately licensed; never upload a downloadable IPA from a public repository.
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: red-fit-ios-unsigned-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            vendor/opengym-upstream/frontend/ios/App/build/simulator.log
            vendor/opengym-upstream/frontend/ios/App/build/device.log
            vendor/opengym-upstream/frontend/ios/App/build/native-dock-smoke.log
            vendor/opengym-upstream/frontend/ios/App/build/dd-sim/Logs/Test/*.xcresult
            vendor/opengym-upstream/frontend/ios/App/build/unsigned/RED-Fit-UNSIGNED.ipa
