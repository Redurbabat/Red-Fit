# TEMPORARY integration QA: compile Agent 01 training code with Agent 04 native iOS
# files without merging, changing either agent's branch or attempting Apple signing.
name: Agent 01 + 04 iPhone integration (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/agent01-04-iphone-integration-temporary.yml'
      - 'vendor/opengym-upstream/frontend/**'

permissions:
  contents: read

jobs:
  original-iphone-combined:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/opengym-upstream/frontend
    steps:
      - name: Checkout Agent 01 openGym training source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Overlay only Agent 04 original iOS app files at pinned commit
        working-directory: .
        run: |
          set -eu
          git fetch --no-tags origin 321da769a9f49873bdc29e2bbe9631dd48c4f23e
          git restore --source=FETCH_HEAD -- \
            vendor/opengym-upstream/frontend/capacitor.config.json \
            vendor/opengym-upstream/frontend/ios/App/App/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/OpenGymWidgets/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/Watch/Info.plist \
            vendor/opengym-upstream/frontend/ios/App/Watch/de.lproj/InfoPlist.strings \
            vendor/opengym-upstream/frontend/ios/ci/brand-red-fit.swift \
            vendor/opengym-upstream/frontend/package.json \
            vendor/opengym-upstream/frontend/scripts/check-ios-mobile-bundle.mjs \
            vendor/opengym-upstream/frontend/scripts/check-ios-mobile-bundle.test.mjs \
            vendor/opengym-upstream/frontend/scripts/verify-ios-identity.mjs \
            vendor/opengym-upstream/frontend/scripts/verify-ios-identity.test.mjs
          test "$(git rev-parse FETCH_HEAD)" = 321da769a9f49873bdc29e2bbe9631dd48c4f23e
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --name-only
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/opengym-upstream/frontend/package-lock.json
      - name: Install original openGym dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify merged identity and mobile asset helpers
        run: |
          npm run test:ios-bundle
          npm run test:ios-identity-unit
      - name: Build original RED Fit iPhone web payload and sync to Xcode
        run: npm run build:ios
      - name: Attach original Watch, Widget and Background Asset extensions
        run: |
          ruby ios/ci/add-asset-downloader.rb
          ruby ios/ci/add-watch-app.rb
          ruby ios/ci/add-widgets.rb
      - name: Compile unsigned iPhone simulator app
        run: |
          set -o pipefail
          mkdir -p ios/App/build
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/App/build/dd-sim CODE_SIGNING_ALLOWED=NO \
            build | tee ios/App/build/integration-simulator.log
          test -d ios/App/build/dd-sim/Build/Products/Debug-iphonesimulator/App.app
      - name: Compile unsigned iPhone device app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build/dd-device CODE_SIGNING_ALLOWED=NO \
            build | tee ios/App/build/integration-device.log
          test -d ios/App/build/dd-device/Build/Products/Debug-iphoneos/App.app
      - name: Retain read-only build logs (private)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent01-04-ios-integration-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            vendor/opengym-upstream/frontend/ios/App/build/integration-simulator.log
            vendor/opengym-upstream/frontend/ios/App/build/integration-device.log
