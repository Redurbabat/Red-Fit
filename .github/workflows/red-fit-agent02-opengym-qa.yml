# Agent 02: independently verify the ORIGINAL openGym frontend, not legacy root/src.
# Never signs iOS binaries, publishes, or mutates the project.
name: RED Fit Agent 02 - openGym Frontend QA

on:
  pull_request:
    paths:
      - 'vendor/opengym-upstream/frontend/**'
      - '.github/workflows/red-fit-agent02-opengym-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-opengym-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vendor/opengym-upstream/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/opengym-upstream/frontend/package-lock.json

      - name: Dependency-free dock and Home regressions
        run: |
          node scripts/check-red-fit-dock-direction.mjs
          node scripts/check-red-fit-dock-event-integration.mjs
          node scripts/check-red-fit-dock-layout.mjs
          node scripts/check-red-fit-dock-route.mjs
          node scripts/check-red-fit-home-week.mjs
          node scripts/check-red-fit-week-reveal.mjs
          node scripts/check-red-fit-week-status.mjs

      - name: Install original openGym dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Agent 02 actual React and CSS Vitest tests
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test -- src/components/TabBar.red-fit.test.jsx src/components/TabBar.test.jsx src/components/red-fit-dock.styles.test.js src/views/Home.red-fit-a11y.test.js

      - name: Full original openGym Vitest suite
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test

      - name: Original openGym production Vite build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run build

      # This is the actual iOS/Android web asset flavor used before Capacitor
      # copies files into the native shells. It never signs or modifies Xcode.
      - name: Mobile-flavor Vite build for iPhone and Android
        id: mobile_build
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: VITE_MOBILE=1 npm run build

      - name: Verify mobile flavor tag, referenced assets and service worker
        if: ${{ always() && steps.mobile_build.outcome == 'success' }}
        run: node scripts/check-mobile-bundle.mjs
